# FaceitWatcher zu Hause hosten: Overlay-Server + Discord-Bot.
# Start:  docker compose up -d --build
# Logs:   docker compose logs -f
#
# Nur der Server fragt die Faceit-API ab. Der Bot liest die Matches vom Server
# (http://faceitwatcher:3000) und postet sie in Discord.

services:
  faceitwatcher:
    build: .
    image: faceitwatcher
    container_name: faceitwatcher
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DB_PATH: /app/data/faceitwatcher.db
    ports:
      - "3000:3000"   # Editor + OBS-Overlay unter http://<IP-des-Servers>:3000
    volumes:
      - ./data:/app/data

  discord-bot:
    image: faceitwatcher
    container_name: faceitwatcher-bot
    restart: unless-stopped
    depends_on:
      - faceitwatcher
    command: ["node", "--disable-warning=ExperimentalWarning", "--import", "tsx", "src/bot/index.ts"]
    env_file: .env
    environment:
      FACEITWATCHER_URL: http://faceitwatcher:3000
      BOT_DATA_DIR: /app/data/bot
    volumes:
      - ./data:/app/data
