# FaceitWatcher zu Hause hosten.
# Start:  docker compose up -d --build
# Logs:   docker compose logs -f

services:
  faceitwatcher:
    build: .
    image: faceitwatcher
    container_name: faceitwatcher
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DB_PATH: /app/data/faceitwatcher.db
    ports:
      - "3000:3000"   # Editor + OBS-Overlay unter http://<IP-des-Servers>:3000, Landingpage unter /site/
    volumes:
      - ./data:/app/data
      - ./website:/app/website:ro   # optional: Landingpage aus dem privaten Website-Repo

