<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>FaceitWatcher Overlay</title>
    <style>
      html, body { margin: 0; background: transparent; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="stage" style="display: inline-block; min-width: 96px; min-height: 96px"><div id="overlay"></div></div>
    <script type="module">
      import { renderOverlay } from '/js/render.js';
      import { createLoader } from '/js/loader.js';

      const id = location.pathname.split('/').pop();
      const container = document.getElementById('overlay');
      // Ohne Abdunkeln, damit in OBS nur das Overlay selbst verschwimmt
      const loader = createLoader(document.getElementById('stage'), { clear: true });

      let overlay, state;
      await loader.wrap(async () => {
        overlay = await (await fetch(`/api/overlays/${id}`)).json();
        state = await (await fetch('/api/state')).json();
        draw();
      });

      function draw() {
        renderOverlay(container, overlay, state);
      }

      const events = new EventSource('/api/events');
      events.addEventListener('state', (e) => {
        state = JSON.parse(e.data);
        draw();
      });
      // Änderungen im Editor erscheinen sofort in OBS, mit kurzem Ladebildschirm
      let settle = null;
      events.addEventListener('overlay', (e) => {
        const updated = JSON.parse(e.data);
        if (updated.id !== id) return;
        if (!settle) loader.show();
        clearTimeout(settle);
        overlay = updated;
        draw();
        settle = setTimeout(() => {
          settle = null;
          loader.hide();
        }, 400);
      });
    </script>
  </body>
</html>
