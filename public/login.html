<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Login · FaceitWatcher</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/css/editor.css" />
    <!-- Login für den Editor. Eine eigene Startseite (SITE_DIR) kann eine eigene login.html mitbringen. -->
    <style>
      /* Wie login.html der Website: Karte, Kicker, große Felder, oranger Button */
      body { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: radial-gradient(900px 500px at 50% -10%, rgba(255, 85, 0, .12), transparent 70%), var(--bg); font-size: 17px; line-height: 1.6; }
      .login { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 32px 28px 28px; box-shadow: 0 24px 60px rgba(0, 0, 0, .35); }
      .login .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 28px; }
      .eyebrow { font: 600 13px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
      .login h1 { font: 700 32px/1.1 var(--f-display); margin: 12px 0 8px; }
      .sub { color: var(--muted); margin: 0 0 24px; font-size: 16px; }
      .login label { display: block; font: 600 13px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
      .login label span { display: block; margin-bottom: 8px; }
      .login input { display: block; width: 100%; font: 500 17px/1.2 var(--f-body); background: var(--bg-2); border-radius: 8px; padding: 13px 14px; margin-bottom: 18px; text-transform: none; letter-spacing: 0; }
      .login button[type='submit'] { width: 100%; font-size: 15px; letter-spacing: .04em; padding: 15px 20px; }
      .login button[type='submit']:hover { box-shadow: 0 8px 24px var(--glow); }
      .login button:disabled { opacity: .6; cursor: wait; box-shadow: none; }
      .msg { min-height: 1.5em; margin: 14px 0 0; color: var(--danger); font-size: 15px; }
      .msg.info { color: var(--muted); }
      @media (max-width: 400px) { .login { padding: 26px 20px 22px; } }
    </style>
  </head>
  <body>
    <form class="login" id="loginForm" novalidate>
      <div class="top">
        <div class="brand"><img class="brand-mark" src="/logo.svg" alt="" width="28" height="28" /><b>Faceit<span>Watcher</span></b></div>
        <select id="langSel" class="lang" aria-label="Sprache" data-i18n-aria-label="langLabel"></select>
      </div>
      <div class="eyebrow" data-i18n="loginEyebrow">Overlay-Editor</div>
      <h1 data-i18n="loginH">Anmelden</h1>
      <p class="sub" data-i18n="loginSub">Nach dem Login landest du direkt im Editor für deine OBS-Overlays.</p>
      <label><span data-i18n="loginUser">Benutzername</span><input id="user" autocomplete="username" autofocus /></label>
      <label><span data-i18n="loginPass">Passwort</span><input id="password" type="password" autocomplete="current-password" /></label>
      <button type="submit" id="submit" data-i18n="loginBtn">Anmelden</button>
      <p class="msg" id="msg" role="alert"></p>
    </form>
    <script type="module">
      import { initLangSelect, t } from '/js/i18n.js';

      const $ = (id) => document.getElementById(id);
      let lastKey = null;
      const show = (key, info) => {
        lastKey = key;
        $('msg').textContent = key ? t(key) : '';
        $('msg').className = info ? 'msg info' : 'msg';
      };
      initLangSelect($('langSel'));
      document.addEventListener('fw:lang', () => lastKey && ($('msg').textContent = t(lastKey)));

      // Nur Pfade auf diesem Server als Ziel zulassen
      let next = new URLSearchParams(location.search).get('next') || '';
      if (!/^\/(?![\/\\])/.test(next)) next = '/editor.html';

      const me = await fetch('/api/me').then((r) => r.json()).catch(() => null);
      if (me?.user) location.replace(next);
      else if (me && !me.loginEnabled) show('loginDisabled', true);

      $('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const user = $('user').value.trim();
        const password = $('password').value;
        if (!user || !password) return show('loginMissing');
        $('submit').disabled = true;
        show(null);
        try {
          const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user, password }) });
          if (r.ok) return location.replace(next);
          show(r.status === 429 ? 'loginLocked' : r.status === 503 ? 'loginDisabled' : 'loginWrong');
          $('password').value = '';
        } catch {
          show('loginNoServer');
        } finally {
          $('submit').disabled = false;
        }
      });
    </script>
  </body>
</html>
