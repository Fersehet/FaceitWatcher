<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 331 72" width="331" height="72">
  <title>FaceitWatcher</title>
  <style>
    .mark { transform-origin: 32px 32px; animation: scope 4s cubic-bezier(.2, .8, .3, 1) 1.4s infinite; }
    .ring { stroke-dasharray: 100; stroke-dashoffset: 100; transform: rotate(-90deg); transform-origin: 32px 32px; animation: draw .7s cubic-bezier(.6, 0, .2, 1) .1s forwards; }
    .cross { opacity: 0; transform: scale(.4); transform-origin: 32px 32px; animation: pop .45s cubic-bezier(.3, 1.6, .5, 1) .45s forwards; }
    .core { opacity: 0; animation: fade .4s ease .3s forwards; }
    .arrow { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw .45s ease-out .65s forwards; }
    .head { opacity: 0; transform: translate(-6px, 6px); animation: shoot .3s ease-out 1s forwards; }
    .word { opacity: 0; animation: rise .5s ease .75s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pop { to { opacity: 1; transform: none; } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes shoot { to { opacity: 1; transform: none; } }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes scope { 0%, 30%, 100% { transform: scale(1); } 8% { transform: scale(1.22); } 15%, 22% { transform: scale(1.15); } }
    @media (prefers-reduced-motion: reduce) { .mark, .ring, .cross, .core, .arrow, .head, .word { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; } }
  </style>
  <defs>
    <mask id="fw-cut-al">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M13 45L24.5 34.5L31 40L48 21" fill="none" stroke="#000" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M57 8L55 27L38 10Z" fill="#000" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g class="mark">
    <g mask="url(#fw-cut-al)">
      
