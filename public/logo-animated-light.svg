      <path class="cross" d="M32 1.5V24M32 40V62.5M1.5 32H24M40 32H62.5" stroke="#ff5500" stroke-width="3.5"/>
    </g>
    <path class="arrow" pathLength="100" d="M13 45L24.5 34.5L31 40L48 21" fill="none" stroke="#111111" stroke-width="5" stroke-linecap="square"/>
    <path class="head" d="M57 8L55 27L38 10Z" fill="#111111"/>
  </g>
