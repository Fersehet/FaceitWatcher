# Logrotate für Nginx Proxy Manager: Zugriffs- und Fehler-Logs nach 14 Tagen löschen.
# Ersetzt die Standarddatei im Container (dort: wöchentlich, 4 bzw. 10 Wochen aufbewahrt).
# Einbinden siehe deploy/nginx-proxy-manager/README.md

/data/logs/*_access.log /data/logs/*/access.log /data/logs/*_error.log /data/logs/*/error.log {
    su npm npm
    create 0644
    daily
    rotate 14
    maxage 14
    missingok
    notifempty
    compress
    sharedscripts
    postrotate
    kill -USR1 `cat /run/nginx/nginx.pid 2>/dev/null` 2>/dev/null || true
    endscript
}
